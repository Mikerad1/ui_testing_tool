<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counter acceptance fixture</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f8; color: #18212b; }
      main { width: min(28rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #d9e0e7; border-radius: 8px; background: #fff; }
      h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
      #count { display: block; margin-bottom: 1rem; font-size: 2rem; font-variant-numeric: tabular-nums; }
      button { min-height: 2.75rem; padding: 0.65rem 1rem; border: 0; border-radius: 5px; background: #2457c5; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #91b5ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Counter</h1>
      <output id="count" aria-live="polite">0</output>
      <button type="button" aria-label="Increment counter" data-testid="counter-increment">Increment</button>
      <button type="button" id="nested-save"><span>Nested Save</span></button>
      <output id="nested-save-status" aria-live="polite"></output>
      <label>Native placeholder acceptance <input id="native-placeholder" type="text" placeholder="Native placeholder acceptance"></label>
      <label for="native-upload">Upload fixture</label>
      <input id="native-upload" type="file">
      <output id="upload-status" aria-live="polite"></output>
      <section id="native-controls" hidden>
        <div id="native-wait-duplicate-container" hidden>
          <output class="native-wait-duplicate">first hidden match</output>
          <output class="native-wait-duplicate">second hidden match</output>
        </div>
        <button type="button" id="native-hide-delay-trigger">Trigger delayed hide</button>
        <output id="native-hidden-delayed" hidden>Hide after delay</output>
        <button type="button" id="native-enable-delay-trigger">Trigger delayed enable</button>
        <button type="button" id="native-enabled-delayed" disabled>Enable after delay</button>
        <button type="button" id="native-enabled-never" disabled>Remain disabled</button>
        <div hidden><button type="button" id="native-enabled-hidden">Hidden but enabled</button></div>
        <div id="native-wait-hidden-container" hidden><output id="native-wait-hidden">hidden but attached</output></div>
        <output id="native-detach-one">remove-me</output>
        <button type="button" id="remove-native-detach-one">Remove one target</button>
        <button type="button" id="remove-native-wait-duplicates">Remove duplicate targets</button>
        <label>Native text <input id="native-text" type="text"></label>
        <label>Native select
          <select id="native-select"><option value="first">First</option><option value="second">Second</option></select>
          <output id="native-select-status"></output>
        </label>
        <div id="native-scroll-target">Native scroll target</div>
        <output id="native-scroll-status"></output>
        <output id="native-key-status"></output>
      </section>
    </main>
    <script>
      const count = document.getElementById('count');
      window.emitDiagnosticsProbe = () => {
        let observed;
        const observe = event => { observed = { type: event.type, targetIsWindow: event.target === window }; };
        window.addEventListener('error', observe, { once: true });
        window.dispatchEvent(new ErrorEvent('error', { message: 'NATIVE_DIAGNOSTIC_SENTINEL_MESSAGE', filename: 'https://NATIVE_DIAGNOSTIC_SENTINEL_URL.invalid/secret.js' }));
        Promise.reject({ message: 'NATIVE_DIAGNOSTIC_SENTINEL_REJECTION' });
        return observed;
      };
      document.querySelector('button').addEventListener('click', () => {
        count.textContent = String(Number(count.textContent) + 1);
      });
      document.getElementById('nested-save').addEventListener('click', () => {
        document.getElementById('nested-save-status').textContent = 'Saved';
        document.getElementById('native-controls').hidden = false;
        if (!document.getElementById('native-wait-appeared')) {
          setTimeout(() => {
            if (document.getElementById('native-wait-appeared')) return;
            const target = document.createElement('output');
            target.id = 'native-wait-appeared';
            document.body.append(target);
          }, 100);
        }
      });
      document.getElementById('native-enable-delay-trigger').addEventListener('click', () => {
        const target = document.getElementById('native-enabled-delayed');
        target.disabled = true;
        window.nativeEnabledTransitionDueAt = performance.now() + 2000;
        setTimeout(() => { target.disabled = false; }, 2000);
      });
      document.getElementById('native-hide-delay-trigger').addEventListener('click', () => {
        const target = document.getElementById('native-hidden-delayed');
        target.hidden = false;
        window.nativeHiddenTransitionDueAt = performance.now() + 2000;
        setTimeout(() => { target.hidden = true; }, 2000);
      });
      document.getElementById('remove-native-detach-one').addEventListener('click', () => {
        document.getElementById('native-detach-one')?.remove();
      });
      document.getElementById('remove-native-wait-duplicates').addEventListener('click', () => {
        document.querySelectorAll('.native-wait-duplicate').forEach(target => target.remove());
      });
      const uploadStatus = document.getElementById('upload-status');
      document.getElementById('native-upload').addEventListener('change', async event => {
        const file = event.currentTarget.files?.[0];
        if (!file) {
          uploadStatus.textContent = '';
          return;
        }
        uploadStatus.textContent = `${file.name} | ${file.size} bytes | ${await file.text()}`;
      });
      document.getElementById('native-select').addEventListener('change', event => {
        document.getElementById('native-select-status').textContent = `change:${event.currentTarget.value}`;
      });
      document.addEventListener('keydown', event => {
        document.getElementById('native-key-status').textContent = event.key;
      });
      document.getElementById('native-scroll-target').style.marginBottom = '1200px';
      window.addEventListener('scroll', () => {
        document.getElementById('native-scroll-status').textContent = String(window.scrollY);
      });
    </script>
  </body>
</html>
